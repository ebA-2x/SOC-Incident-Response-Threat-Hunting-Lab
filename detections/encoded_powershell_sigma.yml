title: Northstar Lab - Encoded PowerShell Execution
id: 688febee-7559-421a-9c92-27d3741d5601
status: experimental
description: Detects PowerShell launched with encoded command arguments in synthetic lab telemetry.
author: Northstar SOC Portfolio (educational)
date: 2026-10-22
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    Image|endswith:
      - '\\powershell.exe'
      - '\\pwsh.exe'
  selection_command:
    CommandLine|contains:
      - '-EncodedCommand'
      - '-enc '
  condition: selection_image and selection_command
falsepositives:
  - Authorized administrative scripts
level: medium
tags:
  - attack.execution
  - attack.t1059.001
